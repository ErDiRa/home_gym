version: "2"

# Each service in internal/service/<name> owns its queries (queries.sql) and gets its own
# generated package (repos/). All of them share the schema and the Go options.
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "internal/service/account/queries.sql"
    gen:
      # The options of this first service are reused by the others (<<: *go).
      go: &go
        package: "repos"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true # :many returns [] instead of nil, so it encodes as []
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          # NUMERIC(7, 2) amounts fit a float64 exactly enough and encode as JSON numbers
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          # Nullable columns as pointers, so they encode as JSON null
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              type: "float64"
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
        out: "internal/service/account/repos"
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "internal/service/cycle/queries.sql"
    gen:
      go:
        <<: *go
        out: "internal/service/cycle/repos"
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "internal/service/exercise/queries.sql"
    gen:
      go:
        <<: *go
        out: "internal/service/exercise/repos"
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "internal/service/feedback/queries.sql"
    gen:
      go:
        <<: *go
        out: "internal/service/feedback/repos"
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "internal/service/lookup/queries.sql"
    gen:
      go:
        <<: *go
        out: "internal/service/lookup/repos"
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "internal/service/training/queries.sql"
    gen:
      go:
        <<: *go
        out: "internal/service/training/repos"
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "internal/service/workout/queries.sql"
    gen:
      go:
        <<: *go
        out: "internal/service/workout/repos"
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "internal/service/whoop/queries.sql"
    gen:
      go:
        <<: *go
        out: "internal/service/whoop/repos"
