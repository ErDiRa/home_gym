# sqlc for the whoop module: queries/*.sql against the module's own migrations (plus those of the
# modules its foreign keys reference), generated into dbmodels/ (never edit by hand). Run
# `sqlc generate` in this directory (or `task db:gen`).
version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "../../../identity/adapters/db/migrations"
      - "../../../catalog/adapters/db/migrations"
      - "../../../planning/adapters/db/migrations"
      - "../../../tracking/adapters/db/migrations"
      - "migrations"
    queries: "queries"
    gen:
      go:
        package: "dbmodels"
        out: "dbmodels"
        sql_package: "pgx/v5"
        emit_empty_slices: true # :many returns [] instead of nil
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          # NUMERIC(7, 2) amounts fit a float64 exactly enough
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              type: "float64"
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
