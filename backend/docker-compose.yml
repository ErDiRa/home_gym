services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erdira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nopassword}
      POSTGRES_DB: ${POSTGRES_DB:-my_accessories}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql
      - pgdata:/var/lib/postgresql
      # Dev seed data (db/seed/seed.sh), applied by `task backend:fresh` once the backend has
      # created the schemas; the backend migrates the database itself, nothing runs on initdb
      - ./db/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: workout_backend
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DB_SOURCE: postgres://${POSTGRES_USER:-erdira}:${POSTGRES_PASSWORD:-nopassword}@db:5432/${POSTGRES_DB:-my_accessories}?sslmode=disable
      PORT: "8080"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # WHOOP app from developer.whoop.com (optional; unset = no WHOOP)
      WHOOP_CLIENT_ID: ${WHOOP_CLIENT_ID:-}
      WHOOP_CLIENT_SECRET: ${WHOOP_CLIENT_SECRET:-}
      WHOOP_REDIRECT_URL: ${WHOOP_REDIRECT_URL:-http://localhost:5173/api/whoop/callback}
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
