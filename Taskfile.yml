version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  backend:up:
    desc: Run the backend dev environment (Postgres + API with hot reload)
    dir: backend
    cmds:
      - docker compose up -d

  backend:build:
    desc: Rebuild the backend image (only needed after changing Dockerfile.dev or go.mod/go.sum) and restart it
    dir: backend
    cmds:
      - docker compose up --build -d backend

  backend:down:
    desc: Stop the backend containers
    dir: backend
    cmds:
      - docker compose down

  backend:reset:
    desc: Stop the backend containers and wipe the database volume
    dir: backend
    cmds:
      - docker compose down -v

  backend:fresh:
    desc: Wipe the database, recreate it from the schema, apply the seeds and start the backend
    dir: backend
    cmds:
      - docker compose down -v
      # Schema and db/seed/*.sql run on first init of the empty volume; --wait blocks until healthy
      - docker compose up -d --wait db
      - docker compose up -d backend

  api:gen:
    desc: Regenerate the API code from backend/api/openapi.yaml (Go server + models, frontend types)
    cmds:
      - cd backend && go generate ./internal/api
      - cd frontend/app && npm run gen:api

  app:dev:
    desc: Run the frontend in dev mode (Vite on :5173)
    dir: frontend/app
    cmds:
      - npm install --no-audit --no-fund
      - npm run dev

  dev:
    desc: Run the backend containers and the Vite dev server together
    deps: [backend:up, app:dev]

  image:build:
    desc: Build the production image (API + built frontend) for linux/amd64, tagged $APP_IMAGE
    requires:
      vars: [APP_IMAGE]
    cmds:
      - docker buildx build --platform linux/amd64 -t {{.APP_IMAGE}} --load .

  image:push:
    desc: Build the production image for linux/amd64 and push it as $APP_IMAGE (docker login ghcr.io first)
    requires:
      vars: [APP_IMAGE]
    cmds:
      - docker buildx build --platform linux/amd64 -t {{.APP_IMAGE}} --push .

  prod:copy:
    desc: "Copy the files the production stack needs to $SERVER (e.g. stefan@1.2.3.4) under /opt/homegym, no repo checkout"
    requires:
      vars: [SERVER]
    cmds:
      # --relative keeps the repo layout, so the compose file's ../backend/db mounts resolve
      - >-
        rsync -av --relative
        deploy/docker-compose.yml deploy/Caddyfile deploy/.env.example
        backend/db/migrations/000001_init_schema.up.sql backend/db/seed/seed-lookups.sql
        {{.SERVER}}:/opt/homegym/

  prod:up:
    desc: "On the server: pull the image and (re)start the production stack (needs deploy/.env)"
    dir: deploy
    cmds:
      - docker compose pull
      - docker compose up -d --wait

  prod:logs:
    desc: "On the server: follow the app's logs"
    dir: deploy
    cmds:
      - docker compose logs -f app
