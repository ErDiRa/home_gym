version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  backend:up:
    desc: Run the backend dev environment (Postgres + API with hot reload)
    dir: backend
    cmds:
      - docker compose up --build -d

  backend:down:
    desc: Stop the backend containers
    dir: backend
    cmds:
      - docker compose down

  backend:reset:
    desc: Stop the backend containers and wipe the database volume
    dir: backend
    cmds:
      - docker compose down -v

  backend:fresh:
    desc: Wipe the database, recreate it from the schema, apply the seeds and start the backend
    dir: backend
    cmds:
      - docker compose down -v
      # Schema and db/seed/*.sql run on first init of the empty volume; --wait blocks until healthy
      - docker compose up --build -d --wait db
      - docker compose up --build -d backend

  admin:dev:
    desc: Run the admin frontend in dev mode (Vite on :5173)
    dir: frontend/admin
    cmds:
      - npm install --no-audit --no-fund
      - npm run dev

  client:dev:
    desc: Run the client frontend in dev mode (Vite on :5174)
    dir: frontend/client
    cmds:
      - npm install --no-audit --no-fund
      - npm run dev

  dev:
    desc: Run backend containers and both Vite dev servers together
    deps: [backend:up, admin:dev, client:dev]
