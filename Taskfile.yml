version: "3"

vars:
  # The dev Postgres user (backend/docker-compose.yml)
  DB_USER: erdira

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  backend:up:
    desc: Run the backend dev environment (Postgres + API with hot reload)
    dir: backend
    cmds:
      - docker compose up -d

  backend:build:
    desc: Rebuild the backend image (only needed after changing Dockerfile.dev or go.mod/go.sum) and restart it
    dir: backend
    cmds:
      - docker compose up --build -d backend

  backend:down:
    desc: Stop the backend containers
    dir: backend
    cmds:
      - docker compose down

  backend:reset:
    desc: Stop the backend containers and wipe the database volume
    dir: backend
    cmds:
      - docker compose down -v

  backend:fresh:
    desc: Wipe the database, let the backend recreate it, then apply the dev seeds
    dir: backend
    cmds:
      - docker compose down -v
      - docker compose up -d --wait db
      - docker compose up -d backend
      # The backend migrates on start and only then answers /healthz
      - until curl -sf localhost:8080/healthz >/dev/null; do sleep 1; done
      - docker compose exec -T db sh /seed/seed.sh

  test:
    desc: Run the backend unit tests (no database)
    dir: backend
    cmds:
      - go test ./...

  test:db:
    desc: Create the test database (my_accessories_test) in the dev Postgres if it's missing
    dir: backend
    cmds:
      - docker compose up -d --wait db
      - >-
        docker compose exec -T db psql -U {{.DB_USER}} -d postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname = 'my_accessories_test'" | grep -q 1
        || docker compose exec -T db createdb -U {{.DB_USER}} my_accessories_test

  test:integration:
    desc: Run the integration tests (the modules' Postgres adapters against the test database)
    deps: [test:db]
    dir: backend
    env:
      TEST_DB_SOURCE: postgres://{{.DB_USER}}:nopassword@localhost:5432/my_accessories_test?sslmode=disable
    cmds:
      - go test -tags integration -count=1 ./...

  test:component:
    desc: Run the component tests (the whole service against the test database)
    deps: [test:db]
    dir: backend
    env:
      TEST_DB_SOURCE: postgres://{{.DB_USER}}:nopassword@localhost:5432/my_accessories_test?sslmode=disable
    cmds:
      - go test -tags component -count=1 ./tests/...

  api:gen:
    desc: Regenerate the API code from the OpenAPI specs (Go servers, clients and models; frontend types)
    cmds:
      - cd backend && go generate ./...
      - cd frontend/app && npm run gen:api

  db:gen:
    desc: Regenerate the database code (sqlc) of every module, in the backend container
    dir: backend
    cmds:
      - for f in modules/*/adapters/db/sqlc.yaml; do docker exec -w /app workout_backend sqlc generate -f "$f"; done

  app:dev:
    desc: Run the frontend in dev mode (Vite on :5173)
    dir: frontend/app
    cmds:
      - npm install --no-audit --no-fund
      - npm run dev

  dev:
    desc: Run the backend containers and the Vite dev server together
    deps: [backend:up, app:dev]

  image:build:
    desc: Build the production image (API + built frontend) for linux/amd64, tagged $APP_IMAGE
    requires:
      vars: [APP_IMAGE]
    cmds:
      - docker buildx build --platform linux/amd64 -t {{.APP_IMAGE}} --load .

  image:push:
    desc: Build the production image for linux/amd64 and push it as $APP_IMAGE (docker login ghcr.io first)
    requires:
      vars: [APP_IMAGE]
    cmds:
      - docker buildx build --platform linux/amd64 -t {{.APP_IMAGE}} --push .

  prod:copy:
    desc: "Copy the files the production stack needs to $SERVER (e.g. stefan@1.2.3.4) under /opt/homegym, no repo checkout"
    requires:
      vars: [SERVER]
    cmds:
      # The app creates and migrates the database itself, so only the stack's own files are needed
      - >-
        rsync -av --relative
        deploy/docker-compose.yml deploy/Caddyfile deploy/.env.example
        {{.SERVER}}:/opt/homegym/

  prod:up:
    desc: "On the server: pull the image and (re)start the production stack (needs deploy/.env)"
    dir: deploy
    cmds:
      - docker compose pull
      - docker compose up -d --wait

  prod:logs:
    desc: "On the server: follow the app's logs"
    dir: deploy
    cmds:
      - docker compose logs -f app
